---
- name: dnf install dnf-automatic
  ansible.builtin.dnf: name=dnf-automatic state=present
  become: true

- name: /etc/dnf/automatic.conf
  ansible.builtin.copy:
    content: |
      [commands]
      apply_updates=True
      reboot=when-needed
    dest: /etc/dnf/automatic.conf
  become: true

- name: Create /etc/systemd/system/dnf5-automatic.timer.d/ directory
  ansible.builtin.file:
    path: /etc/systemd/system/dnf5-automatic.timer.d
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: true

- name: Override default dnf5-automatic.timer
  ansible.builtin.template:
    src: dnf5-automatic-timer-override.conf.j2
    dest: /etc/systemd/system/dnf5-automatic.timer.d/override.conf
    owner: root
    group: root
    mode: '0644'
  become: true
  when: auto_update_time is defined

- name: systemctl daemon-reload
  ansible.builtin.systemd_service: daemon_reload=true
  become: true

- name: systemctl enable --now dnf5-automatic.timer
  ansible.builtin.systemd_service: name=dnf5-automatic.timer enabled=true state=started
  become: true

