- name: Create samba OS user
  ansible.builtin.user:
    name: "{{ item.name }}"
    password: '!'
    password_lock: true
    create_home: false
    uid: "{{ item.uid }}"
    shell: "/usr/bin/nologin"
  become: true
  when:
    - item.name != ansible_facts["user_id"]
    - item.name != "root"
  loop: "{{ smb_users }}"

- name: Current smb users
  ansible.builtin.command: /usr/bin/pdbedit -L
  changed_when: false
  register: samba_users
  become: true

- name: Add samba user
  ansible.builtin.command:
    cmd: smbpasswd -s -a {{ item.name }}
    stdin: |
      {{ item.passwd }}
      {{ item.passwd }}
  become: true
  register: samba_user_status
  changed_when: "'Added user' in samba_user_status.stdout"
  when: samba_users.stdout.find(":item.name:") == -1
  loop: "{{ smb_users }}"

- name: Modify samba firewalld service file samba.xml
  ansible.builtin.copy:
    content: |
      <?xml version="1.0" encoding="utf-8"?>
      <service>
        <short>Samba</short>
        <description>Modified samba server only accept 445/tcp port.</description>
        <port protocol="tcp" port="445"/>
      </service>
    dest: /etc/firewalld/services/samba.xml
    owner: root
    group: root
    mode: '0644'
  become: true
  register: samba_firewalld_file

- name: Reload firewalld when samba.xml changed
  ansible.builtin.command: firewall-cmd --reload
  become: true
  when: samba_firewalld_file.changed

- name: Set firewall rules for samba
  ansible.posix.firewalld:
    rich_rule: rule family="ipv4" source address="{{ item }}" service name="samba" accept
    #zone: "{{ firewalld_default_zone }}"
    permanent: true
    immediate: true
    state: enabled
  become: true
  loop: "{{ samba_accept_source_ipv4 }}"
  when: samba_accept_source_ipv4 is defined

- name: systemctl enable smb.service
  ansible.builtin.systemd_service: name=smb enabled=true
  become: true

- name: dnf install policycoreutils-python-utils
  ansible.builtin.dnf: name=policycoreutils-python-utils state=present
  become: true
  when: ansible_facts["distribution"] == "Fedora"

- name: Set SELinux file context to shared directories
  community.general.sefcontext:
    target: "{{ item.path }}(/.*)?"
    setype: samba_share_t
    state: present
  become: true
  when: ansible_facts["selinux"]["status"] == "enabled"
  loop: "{{ smb_share }}"
  register: samba_share_sefcontext

- name: Apply SELinux file context to shared directories
  ansible.builtin.command: "restorecon -R {{ item.path }}"
  become: true
  when:
    - ansible_facts["selinux"]["status"] == "enabled"
    - samba_share_sefcontext.changed
  loop: "{{ smb_share }}"

